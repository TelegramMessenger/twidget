[workspace]
resolver = "3"
members = ["crates/animations", "crates/base64", "crates/canvas", "crates/compositor", "crates/css", "crates/cstd", "crates/encode", "crates/ends", "crates/filters", "crates/litehtml", "crates/paint", "crates/png", "crates/remote", "crates/shadow", "crates/wire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "BSD-3-Clause"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
field_reassign_with_default = "allow"

[profile.release]
codegen-units = 1
panic = "unwind"
