[workspace]
resolver = "3"
members = ["crates/animations", "crates/base64", "crates/canvas", "crates/compositor", "crates/computed_style", "crates/css", "crates/cstd", "crates/document", "crates/encode", "crates/ends", "crates/events", "crates/filters", "crates/helper", "crates/litehtml", "crates/paint", "crates/png", "crates/remote", "crates/renderer", "crates/replay", "crates/shadow", "crates/wire"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "BSD-3-Clause"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
field_reassign_with_default = "allow"

# nova-safe's own copies of crates.io crates with their `unsafe` removed, which the helper links through
# widget-sandbox's engine: cargo applies a workspace's patches only from the root, so nova-safe's are repeated here.
[patch.crates-io]
bitflags = { path = "../../nova-safe/oxc/vendor/bitflags" }
cow-utils = { path = "../../nova-safe/oxc/vendor/cow-utils" }
num-traits = { path = "../../nova-safe/num-traits" }
unicode-id-start = { path = "../../nova-safe/oxc/vendor/unicode-id-start" }

[profile.release]
codegen-units = 1
panic = "unwind"
